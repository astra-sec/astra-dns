name: Cross Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            command: cargo
            bin: astra-dns
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            command: cross
            bin: astra-dns
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            command: cross
            bin: astra-dns
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            command: cross
            bin: astra-dns
          - os: macos-13
            target: x86_64-apple-darwin
            command: cargo
            bin: astra-dns
          - os: macos-14
            target: aarch64-apple-darwin
            command: cargo
            bin: astra-dns
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            command: cargo
            bin: astra-dns.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.command == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: ${{ matrix.command }} build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "astra-dns-${{ matrix.target }}.zip" ./dist/*
          else
            tar -C dist -czf "astra-dns-${{ matrix.target }}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-dns-${{ matrix.target }}
          path: |
            astra-dns-${{ matrix.target }}.tar.gz
            astra-dns-${{ matrix.target }}.zip
