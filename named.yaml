# Basic configuration
listen_addrs_ipv4: ["0.0.0.0"]
listen_port: 5553
log_level: "Info"
filter_cache_dir: /tmp/astra-dns/filters-cache

lan_hosts:
  enabled: true
  source: /var/dhcp.leases
  domain: lan
  include_unqualified: true
  refresh_interval_secs: 60

filters:
  - enabled: false
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: false
    url: https://adaway.org/hosts.txt
    name: AdAway Default Blocklist
    id: 2
  - enabled: false
    url: https://anti-ad.net/easylist.txt
    name: anti-AD
    id: 1656906663
  - enabled: true
    url: https://fastly.jsdelivr.net/gh/217heidai/adblockfilters@main/rules/adblockdns.txt
    name: 217heidai
    id: 1741278925

user_rules:

filtering:
  blocking_mode: nxdomain
  rewrites:
    - ip:
      - "173.245.48.0/20"
      - "103.21.244.0/22"
      - "103.22.200.0/22"
      - "103.31.4.0/22"
      - "141.101.64.0/18"
      - "108.162.192.0/18"
      - "190.93.240.0/20"
      - "188.114.96.0/20"
      - "197.234.240.0/22"
      - "198.41.128.0/17"
      - "162.158.0.0/15"
      - "104.16.0.0/13"
      - "104.24.0.0/14"
      - "172.64.0.0/13"
      - "131.0.72.0/22"
      answer: 104.18.192.16
    - cname:
      - "domain:cdn.cloudflare.net"
      answer: 104.18.192.16

dns:
  upstream_dns:
    - 8.8.8.8
    - 8.8.4.4
  # AdGuard Home-style DNS cache options
  cache_size: 4096
  # cache_ttl_min: 30
  # cache_ttl_max: 600
