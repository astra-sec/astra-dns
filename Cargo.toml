[package]
name = "astra-dns"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"

[features]
default = ["resolver", "rustls-platform-verifier"]

ascii-art = []
resolver = []
prometheus-metrics = []
metrics = []
rustls-platform-verifier = []

[dependencies]
async-trait = "0.1"
cfg-if = "1"
clap = { version = "4.0", features = ["std", "derive"] }
hickory-resolver = { version = "0.26.3", features = ["https-ring", "webpki-roots", "serde"] }
hickory-server = { version = "0.26.3", features = ["resolver"] }
hickory-proto = { version = "0.26.3", features = ["std"] }
ipnet = { version = "2.3.0" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
regex = "1"
serde = "1.0"
serde_yaml = "0.9"
socket2 = "0.5"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1.30" }
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }
url = "2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "domain_matching"
harness = false
